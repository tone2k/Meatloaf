[package]
name = "watcher"
version = "0.1.0"
edition = "2024"
description = "Local-first daemon that captures the narrative of a codebase's evolution"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
content_inspector = "0.2"
crossbeam-channel = "0.5"
ignore = "0.4"
libc = "0.2"
notify = "8"
notify-debouncer-full = "0.6"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "serde", "parsing"] }
toml = "0.9"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
zstd = "0.13"

[dev-dependencies]
assert_cmd = "2"
libc = "0.2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
